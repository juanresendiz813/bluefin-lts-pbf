name: Classic F45 → Utah switch verification (review only)

# Same harness as classic-to-utah.yml, with the operator's Fedora-45 Classic builds
# (fork images, unsigned) as the source. Sources are pinned by digest at run time and
# the digest is recorded. Runs only on this review branch; publishes nothing; no secrets.

on:
  push:
    branches:
      - review/classic45-to-utah
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classic45-to-utah-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: classic45-to-utah
            old: ghcr.io/juanresendiz813/bluefin:latest-45.20260929
            new: ghcr.io/projectbluefin/utah:testing
            rollback: "1"
            privileged: "1"
          - name: classic45-dx-to-utah
            old: ghcr.io/juanresendiz813/bluefin-dx:latest-45.20260929
            new: ghcr.io/projectbluefin/utah:testing
            rollback: "1"
            privileged: "1"
          - name: control-classic45-reswitch
            old: ghcr.io/juanresendiz813/bluefin:latest-45.20260929
            new: "@same"
            rollback: "0"
            privileged: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / /mnt | tail -2
          podman --version; skopeo --version; jq --version

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf attr
          ls -la /usr/share/OVMF/

      - name: Run harness
        env:
          OLD: ${{ matrix.old }}
          NEW: ${{ matrix.new }}
          LANE: ${{ matrix.name }}
          ROLLBACK: ${{ matrix.rollback }}
          RUN_PRIVILEGED_SETUP: ${{ matrix.privileged }}
          PIN_OLD: "1"
        run: bash ./harness.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classic45-utah-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 14
