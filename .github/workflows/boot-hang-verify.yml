name: Boot-hang verification (review only)

# Review-only harness for projectbluefin/bluefin-lts #391 / #466 / #585: does a machine
# running an old ublue-os LTS image still boot after `bootc switch` to
# projectbluefin/bluefin-lts? Real disk install (bootc install to-disk → bootupd puts
# shim/grub on the ESP), real UEFI boot (OVMF) under QEMU/KVM, real reboot through the
# firmware into the staged deployment. Runs only on this review branch; publishes
# nothing; needs no secrets. Evidence is uploaded as artifacts.

on:
  push:
    branches:
      - review/boot-hang-verify
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-hang-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dx-hwe-to-stable
            old: ghcr.io/ublue-os/bluefin-dx:lts-hwe
            new: ghcr.io/projectbluefin/bluefin-lts:stable
          - name: control-stable-clean
            old: ghcr.io/projectbluefin/bluefin-lts:stable
            new: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
          podman --version; skopeo --version || true; jq --version

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf
          ls -la /usr/share/OVMF/

      - name: Run harness
        env:
          OLD: ${{ matrix.old }}
          NEW: ${{ matrix.new }}
          LANE: ${{ matrix.name }}
        run: bash ./harness.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boot-hang-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 14
