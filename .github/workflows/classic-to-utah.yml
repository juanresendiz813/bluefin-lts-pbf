name: Classic → Utah switch verification (review only)

# Review-only harness: does a Bluefin Classic install still boot, keep its users'
# home labels, bootloader and data after `bootc switch` to projectbluefin/utah, and
# can it roll back? Real disk install (bootc install to-disk → bootupd puts shim/grub
# on the ESP), real UEFI boot (OVMF) under QEMU/KVM, real reboot through the firmware
# into the staged deployment. Runs only on this review branch; publishes nothing;
# needs no secrets. Evidence is uploaded as artifacts, one per lane.

on:
  push:
    branches:
      - review/classic-to-utah
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classic-to-utah-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: classic-to-utah
            old: ghcr.io/ublue-os/bluefin:stable
            new: ghcr.io/projectbluefin/utah:testing
            rollback: "1"
            privileged: "1"
          - name: classic-dx-to-utah
            old: ghcr.io/ublue-os/bluefin-dx:stable
            new: ghcr.io/projectbluefin/utah:testing
            rollback: "1"
            privileged: "1"
          - name: control-utah-clean
            old: ghcr.io/projectbluefin/utah:testing
            new: ""
            rollback: "0"
            privileged: "1"
          - name: control-classic-reswitch
            old: ghcr.io/ublue-os/bluefin:stable
            new: "@same"
            rollback: "0"
            privileged: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / /mnt | tail -2
          podman --version; skopeo --version; jq --version

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf attr
          ls -la /usr/share/OVMF/

      - name: Run harness
        env:
          OLD: ${{ matrix.old }}
          NEW: ${{ matrix.new }}
          LANE: ${{ matrix.name }}
          ROLLBACK: ${{ matrix.rollback }}
          RUN_PRIVILEGED_SETUP: ${{ matrix.privileged }}
        run: bash ./harness.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classic-utah-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 14
